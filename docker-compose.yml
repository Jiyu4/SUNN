# SUNN Conference Website - Docker Compose
# For local development and testing

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunn-web
    ports:
      - "8080:80"
    volumes:
      # Mount data directory for persistent storage
      - ./data:/var/www/html/data
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Admin setup utility
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sunn-setup
    command: ["php", "-S", "0.0.0.0:8081", "-t", "/var/www/html"]
    ports:
      - "8081:8081"
    profiles:
      - setup
